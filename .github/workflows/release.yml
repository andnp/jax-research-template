name: Release CLI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: research-linux-amd64
            ext: ""
          - os: macos-latest
            artifact: research-darwin-amd64
            ext: ""
          - os: windows-latest
            artifact: research-windows-amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CLI and PyInstaller
        run: pip install ./cli pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --name research
          --collect-data research_cli
          cli/src/research_cli/main.py

      - name: Rename artifact
        shell: bash
        run: mv dist/research${{ matrix.ext }} dist/${{ matrix.artifact }}${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
