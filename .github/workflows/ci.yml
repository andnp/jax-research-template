name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  warm-uv-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen

  lint:
    needs: [warm-uv-cache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run ruff check .

  typecheck:
    needs: [warm-uv-cache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pyrefly check

  test-small:
    needs: [warm-uv-cache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pytest tests/small/ -x -q

  test-medium:
    needs: [warm-uv-cache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pytest tests/medium/ -x -q

  test-ale-atari-smoke:
    needs: [warm-uv-cache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: Install Atari ROMs
        run: |
          uv run pip install "autorom[accept-rom-license]"
          uv run AutoROM --accept-license --quiet
      - name: Run ALE Atari smoke tests
        run: uv run pytest tests/regression/test_rl_components_atari_ale_smoke.py tests/regression/test_rl_agents_dqn_atari_ale_smoke.py -x -q

  benchmarks:
    needs: [lint, typecheck, test-small, test-medium]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --frozen
      - name: Run pytest benchmarks
        run: |
          uv run pytest --benchmark-only --benchmark-json output.json tests/performance/
          git restore .
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Env Seam Benchmark
          tool: pytest
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "125%"
          comment-on-alert: true
          comment-always: true
          summary-always: true
          fail-on-alert: false
          auto-push: ${{ github.ref == 'refs/heads/main' }}
