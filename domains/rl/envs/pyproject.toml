[project]
name = "rl-envs"
version = "0.1.0"
description = "External-simulator integrations for RL environments"
requires-python = ">=3.13"
dependencies = [
    "chex~=0.1",
    "jax~=0.9",
    "brax~=0.14",
    "ale-py>=0.10",
    "gymnasium[atari]>=1.0",
    "opencv-python-headless>=4.0",
    "rl-components",
]

[project.optional-dependencies]
playground = [
    "playground>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
rl-components = { workspace = true }
