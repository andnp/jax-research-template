[project]
name = "rl-networks"
version = "0.1.0"
description = "Paper- and environment-tied RL network architectures shared across agents"
requires-python = ">=3.13"
dependencies = [
    "chex~=0.1",
    "distrax>=0.1.8",
    "flax~=0.12",
    "jax~=0.9",
    "jax-nn",
    "rl-components",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
jax-nn = { workspace = true }
rl-components = { workspace = true }
