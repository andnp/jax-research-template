[project]
name = "rl-components"
version = "0.1.0"
description = "Shared RL components (buffers, networks, types)"
requires-python = ">=3.13"
dependencies = [
    "brax~=0.14",
    "chex~=0.1",
    "distrax>=0.1.8",
    "flax~=0.12",
    "gymnax~=0.0",
    "jax-nn",
    "ale-py>=0.10",
    "gymnasium[atari]>=1.0",
    "opencv-python-headless>=4.0",
    "jax~=0.9",
]

[project.optional-dependencies]
playground = [
    "playground>=0.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
jax-nn = { workspace = true }
