[project]
name = "jax-eval"
version = "0.1.0"
description = "Pure JAX diagnostic kernels for research evaluation"
requires-python = ">=3.13"
dependencies = [
    "jax~=0.9",
    "jax-utils",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.uv.sources]
jax-utils = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
