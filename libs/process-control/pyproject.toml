[project]
name = "process-control"
version = "0.1.0"
description = "JAX-native process control simulation environments."
requires-python = ">=3.13"
dependencies = [
    "jax~=0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
